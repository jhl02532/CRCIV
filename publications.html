<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications | CRCIV</title>
    <meta name="description" content="Publications of CRCIV - 곤충 미각, 후각, 벡터 제어 등 주요 연구 논문 및 출판물 목록.">
    <meta name="keywords" content="Publications, CRCIV, Research Papers, Hyung Wook Kwon, 권형욱, 논문">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 5px;
            text-transform: uppercase;
        }
        .badge-q1 { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .badge-high-cited { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .badge-impact { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        


        /* Ensure items are visible even if observer fails */
        .pub-item {
            opacity: 1;
            transform: none;
        }
    </style>
</head>
<body>
    <header></header>


    <main>
        <h1>Publications</h1>
        
        <div class="stats">
            <div class="stat-item">
                <h3 id="stat-total">0</h3>
                <p>Total Publications</p>
            </div>
            <div class="stat-item">
                <h3 id="stat-citations">4,287+</h3>
                <p>Total Citations</p>
            </div>
            <div class="stat-item">
                <h3 id="stat-years">21</h3>
                <p>Research Years</p>
            </div>
        </div>

        <!-- Lab Toggle -->
        <div class="filters" id="lab-filters" style="margin-bottom: 1rem;">
            <button class="filter-btn active" data-lab="SNBL">SNBL (Sensory Neurobiology Brain Laboratory)</button>
            <button class="filter-btn" data-lab="CRCIV">CRCIV (Research Center)</button>
        </div>

        <p id="lab-description" style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-style: italic;">
            SNBL(Sensory Neurobiology Brain Laboratory)의 모든 연구 실적입니다.
        </p>

        <!-- Category Filters -->
        <div class="filters" id="category-filters">
            <button class="filter-btn active" data-filter="all">All Fields</button>
            <button class="filter-btn" data-filter="Taste Receptors">Taste Receptors</button>
            <button class="filter-btn" data-filter="Vector Control">Vector Control</button>
            <button class="filter-btn" data-filter="Olfaction">Olfaction</button>
            <button class="filter-btn" data-filter="Genomics">Genomics</button>
            <button class="filter-btn" data-filter="Biosensors">Biosensors</button>
        </div>

        <div class="pub-list" id="pub-list">
            <!-- Populated via JS -->
        </div>
    </main>

    <footer></footer>


    <script src="assets/js/lab_info.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/publications_data.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pubList = document.getElementById('pub-list');
            const labBtns = document.querySelectorAll('#lab-filters .filter-btn');
            const catBtns = document.querySelectorAll('#category-filters .filter-btn');
            const labDesc = document.getElementById('lab-description');
            
            let currentLab = 'SNBL';
            let currentCat = 'all';

            function renderPublications() {
                if (typeof publicationsData === 'undefined') {
                    console.error('publicationsData is not defined');
                    return;
                }
                
                pubList.innerHTML = '';
                
                const filtered = publicationsData.filter(pub => {
                    const labMatch = pub.labs && pub.labs.includes(currentLab);
                    const catMatch = currentCat === 'all' || pub.category === currentCat;
                    return labMatch && catMatch;
                });

                document.getElementById('stat-total').innerText = filtered.length;

                filtered.forEach(pub => {
                    try {
                        const item = document.createElement('div');
                        item.className = 'pub-item fade-up visible'; // Force visibility for now
                        item.setAttribute('data-category', pub.category || 'General');
                        item.setAttribute('data-year', pub.year || '');
                        
                        let badgesHtml = '';
                        if (pub.badges && Array.isArray(pub.badges)) {
                            badgesHtml = `<div style="margin-bottom: 8px;">
                                ${pub.badges.map(b => `<span class="badge ${b.includes('Classic') || b.includes('Highly') ? 'badge-high-cited' : b.includes('IF') || b.includes('Q1') ? 'badge-q1' : 'badge-impact'}">${b}</span>`).join('')}
                            </div>`;
                        }

                        // Safe DOI link handling
                        const doi = pub.doi || '#';
                        const doiLink = doi !== '#' ? (doi.startsWith('http') ? doi : 'https://doi.org/' + doi) : '#';

                        item.innerHTML = `
                            ${badgesHtml}
                            <h3><a href="${doiLink}" target="_blank" rel="noopener noreferrer">${pub.title} ${doi !== '#' ? '<i class="fas fa-external-link-alt"></i>' : ''}</a></h3>
                            <div class="authors">${pub.authors || ''}</div>
                            <div class="venue">${pub.venue || ''}, ${pub.year || ''}</div>
                            <div class="tags">
                                <span class="year">${pub.year || ''}</span>
                                <span class="tag">${pub.category || 'General'}</span>
                            </div>
                        `;
                        pubList.appendChild(item);
                    } catch (err) {
                        console.error('Error rendering publication:', pub, err);
                    }
                });
            }

            labBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    labBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentLab = btn.dataset.lab;
                    labDesc.innerText = currentLab === 'SNBL' ? 'SNBL(Sensory Neurobiology Brain Laboratory)의 모든 연구 실적입니다.' : '매개곤충자원융복합연구센터(CRCIV) 주도의 중점연구소 사업 성과입니다.';
                    renderPublications();
                });
            });

            catBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    catBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCat = btn.dataset.filter;
                    renderPublications();
                });
            });

            // Initial render
            renderPublications();
        });
    </script>
</body>
</html>
