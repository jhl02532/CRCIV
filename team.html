<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team | CRCIV</title>
    <!-- Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .team-hero {
            background: var(--bg-gray);
            padding: 8rem 2rem 6rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        
        .team-container {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .category-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 2.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
        }

        /* Enhanced PI Profile */
        .pi-card-detailed {
            background: var(--white);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            margin-bottom: 6rem;
            display: grid;
            grid-template-columns: 400px 1fr;
        }

        .pi-sidebar {
            background: var(--bg-gray);
            padding: 3rem;
            text-align: center;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .pi-icon-placeholder {
            font-size: 8rem;
            color: var(--accent-color);
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .pi-stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
        }

        .pi-stat-item {
            background: var(--white);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .pi-stat-val {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-color);
            display: block;
        }

        .pi-stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .pi-content {
            padding: 4rem;
        }

        .pi-header {
            margin-bottom: 3rem;
        }

        .pi-header h2 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .pi-header .role-badge {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .info-section h3 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-section h3 i {
            color: var(--accent-color);
        }

        .info-list {
            list-style: none;
            padding: 0;
        }

        .info-list li {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 0.8rem;
            color: var(--text-main);
            position: relative;
            padding-left: 1.5rem;
        }

        .info-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--accent-color);
            font-weight: bold;
        }

        .member-grid-full {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 3rem;
            margin-bottom: 6rem;
        }

        .member-card-new {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            text-align: center;
            padding: 2.5rem 1.5rem;
            opacity: 0;
            transform: translateY(30px);
        }

        .member-card-new.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .member-card-new:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-color);
        }

        .member-icon-new {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            background: var(--bg-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--accent-color);
        }

        @media (max-width: 1024px) {
            .pi-card-detailed {
                grid-template-columns: 1fr;
            }
            .pi-sidebar {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header></header>

    <section class="team-hero">
        <h1 style="font-size: 3.5rem; font-weight: 800; margin-bottom: 1rem;">Our Team</h1>
        <p style="font-size: 1.2rem; color: var(--text-muted);">세계적 수준의 곤충학 및 신경생물학 연구를 이끄는 CRCIV 전문가 그룹입니다.</p>
    </section>

    <main class="team-container">
        <!-- PI Section -->
        <div id="pi-container"></div>
        <!-- Categories -->
        <div id="team-sections"></div>
    </main>

    <footer></footer>

    <!-- Scripts -->
    <script src="assets/js/lab_info.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="blog_data.js"></script>
    <script src="team_data.js"></script>
    <script src="assets/js/main.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderTeam();
            if (typeof initScrollAnimations === 'function') {
                initScrollAnimations();
            }
        });

        function renderTeam() {
            const piContainer = document.getElementById('pi-container');
            const sectionsContainer = document.getElementById('team-sections');

            if (!piContainer || !sectionsContainer) return;

            // Render PI (Detailed)
            const pi = teamData.pi;
            piContainer.innerHTML = `
                <div class="pi-card-detailed fade-up">
                    <div class="pi-sidebar">
                        <div class="pi-icon-placeholder">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <div class="social-links">
                            <a href="${pi.links.email}"><i class="fas fa-envelope"></i></a>
                            <a href="${pi.links.scholar}"><i class="fas fa-graduation-cap"></i></a>
                            <a href="${pi.links.researchgate}"><i class="fab fa-researchgate"></i></a>
                        </div>
                        <div class="pi-stat-grid">
                            <div class="pi-stat-item">
                                <span class="pi-stat-val">${pi.stats.publications}</span>
                                <span class="pi-stat-label">Publications</span>
                            </div>
                            <div class="pi-stat-item">
                                <span class="pi-stat-val">${pi.stats.citations}</span>
                                <span class="pi-stat-label">Citations</span>
                            </div>
                        </div>
                    </div>
                    <div class="pi-content">
                        <div class="pi-header">
                            <span class="role-badge">Principal Investigator</span>
                            <h2>${pi.name}</h2>
                            <p style="font-size: 1.1rem; color: var(--text-muted);">${pi.role}</p>
                        </div>

                        <div class="info-grid">
                            <div class="info-section">
                                <h3><i class="fas fa-university"></i> Current Affiliations</h3>
                                <ul class="info-list">
                                    ${pi.affiliations.map(a => `<li>${a}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="info-section">
                                <h3><i class="fas fa-graduation-cap"></i> Education</h3>
                                <ul class="info-list">
                                    ${pi.education.map(e => `<li>${e}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="info-section">
                                <h3><i class="fas fa-microscope"></i> Research Interests</h3>
                                <ul class="info-list">
                                    ${pi.interests.map(i => `<li>${i}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="info-section">
                                <h3><i class="fas fa-award"></i> Awards & Highlights</h3>
                                <ul class="info-list">
                                    ${pi.awards.map(a => `<li>${a}</li>`).join('')}
                                    ${pi.stats.highlights.map(h => `<li>${h}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Render other categories
            const categories = [
                { key: 'postdocs', title: 'Post-Doctoral Researchers' },
                { key: 'phd', title: 'Ph.D. Students' },
                { key: 'masters', title: "Master's Students" },
                { key: 'researchers', title: 'Researchers' },
                { key: 'undergrads', title: 'Undergraduate Researchers' }
            ];

            categories.forEach(cat => {
                const members = teamData[cat.key];
                if (!members || members.length === 0) return;

                const section = document.createElement('section');
                section.innerHTML = `
                    <h2 class="category-title">${cat.title}</h2>
                    <div class="member-grid-full">
                        ${members.map(m => `
                            <div class="member-card-new fade-up">
                                <div class="member-icon-new">
                                    <i class="fas fa-user-graduate"></i>
                                </div>
                                <div class="member-name-new">${m.name}</div>
                                <div class="member-role-new">${m.title}</div>
                                <p class="member-bio-new" style="margin-bottom: 1.5rem;">${m.bio}</p>
                                ${m.papers ? `
                                    <div style="text-align: left; background: var(--bg-gray); padding: 1rem; border-radius: 12px;">
                                        <div style="font-size: 0.75rem; font-weight: 800; color: var(--accent-color); text-transform: uppercase; margin-bottom: 0.5rem;">Representative Papers</div>
                                        <ul style="list-style: none; padding: 0; font-size: 0.8rem; line-height: 1.4;">
                                            ${m.papers.map(p => `<li style="margin-bottom: 0.4rem; padding-left: 10px; border-left: 2px solid var(--border-color);">${p}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
                sectionsContainer.appendChild(section);
            });
        }
    </script>
</body>
</html>
