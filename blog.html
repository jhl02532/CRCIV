<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | CRCIV</title>
    <!-- Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .blog-hero {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            padding: 8rem 2rem 10rem;
            text-align: center;
        }
        
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 2.5rem;
            max-width: 1200px;
            margin: -6rem auto 6rem;
            padding: 0 2rem;
            z-index: 10;
            position: relative;
        }
        
        .blog-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.05);
        }
        
        .blog-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        
        .blog-image {
            width: 100%;
            height: 240px;
            overflow: hidden;
            position: relative;
        }
        
        .blog-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .blog-card:hover .blog-image img {
            transform: scale(1.1);
        }
        
        .blog-category {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: var(--accent-color);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .blog-content {
            padding: 2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .blog-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 1rem;
        }
        
        .blog-card h3 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            line-height: 1.4;
            color: #0f172a;
        }
        
        .blog-summary {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }
        
        .blog-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .blog-tag {
            font-size: 0.75rem;
            background: #f1f5f9;
            color: #64748b;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
        }
        
        .blog-footer {
            padding-top: 1.5rem;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .read-more {
            color: var(--accent-color);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">CRC<span>IV</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="blog.html" class="active">Blog</a></li>
                <li><a href="team.html">Team</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="blog-hero">
        <h1>Paper Review & News</h1>
        <p class="subtitle">곤충 감각인지생리의 최신 연구 동향과 성과를 공유합니다.</p>
    </section>

    <div class="blog-grid" id="blog-container">
        <!-- Posts will be injected here -->
    </div>

    <footer>
        <p><strong>Convergence Research Center for Insect Vector (CRCIV)</strong></p>
        <p>Incheon National University | Director: Prof. Hyung Wook Kwon</p>
        <p>&copy; 2026 CRCIV. All rights reserved.</p>
    </footer>

    <script src="blog_data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('blog-container');
            
            blogData.forEach(post => {
                const card = document.createElement('div');
                card.className = 'blog-card';
                card.innerHTML = `
                    <div class="blog-image">
                        <img src="${post.image}" alt="${post.title}">
                        <div class="blog-category">${post.category}</div>
                    </div>
                    <div class="blog-content">
                        <div class="blog-meta">
                            <span><i class="far fa-calendar"></i> ${post.date}</span>
                            <span><i class="far fa-clock"></i> ${post.readTime}</span>
                        </div>
                        <h3>${post.title}</h3>
                        <p class="blog-summary">${post.summary}</p>
                        <div class="blog-tags">
                            ${post.tags.map(tag => `<span class="blog-tag">#${tag}</span>`).join('')}
                        </div>
                        <div class="blog-footer">
                            <a href="${post.link}" target="_blank" class="read-more">
                                Full Paper <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
